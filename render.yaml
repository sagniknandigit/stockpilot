# Render Blueprint: StockPilot backend on Render's FREE tier.
#   Dashboard → New → Blueprint → pick this repo. See DEPLOY.md for the full walkthrough.
#
#   Vercel (frontend) ──► stockpilot-api (FastAPI + Celery worker/beat, one container)
#                              ├──► Neon Postgres (external, free)
#                              └──► stockpilot-redis (Render Key Value, free)
#
# Free web services sleep after 15 min idle; DEPLOY.md sets up a free uptime ping.
# On a paid plan, move the worker into its own `type: worker` service and drop
# RUN_WORKER_IN_PROCESS.

services:
  - type: keyvalue
    name: stockpilot-redis
    plan: free
    region: singapore
    ipAllowList: []            # reachable only from services in this account
    maxmemoryPolicy: noeviction  # never silently drop queued Celery tasks

  - type: web
    name: stockpilot-api
    runtime: docker
    plan: free
    region: singapore          # keep it next to the Neon database (AWS ap-southeast-1)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    buildFilter:
      paths: ["backend/**"]      # relative to the repo root; frontend changes go to Vercel
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # Neon scales to zero when idle; sweep rarely so it can (events are still processed
      # immediately after each sale; these sweeps are only a safety net).
      - key: OUTBOX_SWEEP_SECONDS
        value: "1800"
      - key: WEBHOOK_RETRY_SWEEP_SECONDS
        value: "1800"
      - key: DEMO_RESET_DAILY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService: { type: keyvalue, name: stockpilot-redis, property: connectionString }
      # Values you paste in when creating the Blueprint (see DEPLOY.md):
      - key: DATABASE_URL        # Neon *direct* connection string (not the -pooler one)
        sync: false
      - key: CORS_ORIGINS        # e.g. ["https://stockpilot.vercel.app"]
        sync: false
      - key: CORS_ORIGIN_REGEX   # e.g. ^https://stockpilot-[a-z0-9-]+\.vercel\.app$
        sync: false
      - key: APP_URL             # e.g. https://stockpilot.vercel.app (links in emails)
        sync: false
      - key: GEMINI_API_KEY      # optional: Ask StockPilot
        sync: false
      - key: METRICS_TOKEN       # optional: protects /metrics
        sync: false
